# Local (Kiln) version of .github/workflows/ci.yml. Run it with:
#   kiln run .kiln/workflows/ci.yml --repo .
# Kiln runs Linux containers only, so this file holds the jobs that can run there:
# - the "changes" job and its path filters are left out, every job always runs;
# - "windows-core" stands in for the Windows job (format and build of the non-UI projects);
# - the jobs Kiln cannot run yet (Supabase stack and steps, the full Windows solution) are in
#   ci-github-only.yml. GitHub Actions runs them, so nothing is lost. See docs/setup/ci.md.
name: CI

on:
  push:
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # The connector part of the GitHub "supabase-stack" job. These steps need no database.
  supabase-connector:
    name: Supabase connector lint, types and unit tests
    runs-on: ubuntu-latest
    container: node:22
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Supabase CLI and Deno
        run: npm ci

      - name: Connector lint, types and unit tests (the shared rules run the contract vectors)
        working-directory: supabase/functions
        run: |
          npx deno task lint
          npx deno task check
          npx deno test --allow-read --allow-env --allow-net _shared connector

  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/android-sdk:36
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        working-directory: android
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Build, unit test and lint
        working-directory: android
        # AGP downloads the compile SDK (37) and the build tools it needs.
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: warn

  android-lint:
    name: Android lint
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/android-sdk:36
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: android/app/build/reports/
          if-no-files-found: warn

  windows-core:
    name: Windows core format and build on Linux (tests cannot run)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    timeout-minutes: 25
    env:
      # The projects target net10.0-windows. This lets a Linux SDK restore and build them.
      EnableWindowsTargeting: "true"
    steps:
      - uses: actions/checkout@v7

      # Core.Tests targets net10.0-windows and Infrastructure uses WPF types, so the tests cannot run
      # on Linux (no WindowsDesktop runtime, exit 150) and the target cannot be forced to net10.0
      # (NETSDK1136). Building with EnableWindowsTargeting is the most a Linux container can do.
      # The whole solution needs the private dotnetlib feed (see ci-github-only.yml).
      - name: Restore the non-UI test project
        working-directory: windows
        run: dotnet restore tests/GoalMaker.Core.Tests/GoalMaker.Core.Tests.csproj

      - name: Check formatting
        working-directory: windows
        run: dotnet format whitespace tests/GoalMaker.Core.Tests/GoalMaker.Core.Tests.csproj --verify-no-changes --no-restore

      - name: Build
        working-directory: windows
        run: dotnet build tests/GoalMaker.Core.Tests/GoalMaker.Core.Tests.csproj -c Release --no-restore
