name: Release

# Push a tag vX.Y.Z that matches version.properties, or press "Run workflow" on main. The workflow
# builds the signed APK and the Windows installer and publishes both with a signed manifest as the
# GitHub Release, which is the update channel (ADR 0010). A run started by hand makes the tag itself
# on the commit it built. Setup: docs/setup/signing-and-releases.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag and the setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # A tag push must match version.properties. A run by hand must start on main, and the version
      # must not have a tag yet, so it never moves a released tag.
      - name: Tag matches version.properties
        id: version
        run: |
          name=$(sed -n 's/^versionName=//p' version.properties | tr -d '\r')
          code=$(sed -n 's/^versionCode=//p' version.properties | tr -d '\r')
          tag="v$name"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run the release by hand from main, not $GITHUB_REF"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::Tag $tag already exists; raise versionName and versionCode in version.properties"
              exit 1
            fi
          elif [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name in version.properties"
            exit 1
          fi
          echo "version=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: The update channel key is committed
        run: |
          if [ ! -s contracts/keys/release-manifest-public.b64 ]; then
            echo "::error::contracts/keys/release-manifest-public.b64 is missing; run tools/setup-update-signing.ps1"
            exit 1
          fi

      - name: Every release secret is set
        env:
          GOALMAKER_SUPABASE_URL: ${{ secrets.GOALMAKER_SUPABASE_URL }}
          GOALMAKER_SUPABASE_KEY: ${{ secrets.GOALMAKER_SUPABASE_KEY }}
          GOALMAKER_MANIFEST_SIGNING_KEY: ${{ secrets.GOALMAKER_MANIFEST_SIGNING_KEY }}
          GOALMAKER_KEYSTORE_BASE64: ${{ secrets.GOALMAKER_KEYSTORE_BASE64 }}
          GOALMAKER_KEYSTORE_PASSWORD: ${{ secrets.GOALMAKER_KEYSTORE_PASSWORD }}
          GOALMAKER_KEY_ALIAS: ${{ secrets.GOALMAKER_KEY_ALIAS }}
          GOALMAKER_KEY_PASSWORD: ${{ secrets.GOALMAKER_KEY_PASSWORD }}
        run: |
          missing=""
          for name in GOALMAKER_SUPABASE_URL GOALMAKER_SUPABASE_KEY \
                      GOALMAKER_MANIFEST_SIGNING_KEY GOALMAKER_KEYSTORE_BASE64 GOALMAKER_KEYSTORE_PASSWORD \
                      GOALMAKER_KEY_ALIAS GOALMAKER_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

  android:
    name: Signed APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    env:
      GOALMAKER_SUPABASE_URL: ${{ secrets.GOALMAKER_SUPABASE_URL }}
      GOALMAKER_SUPABASE_KEY: ${{ secrets.GOALMAKER_SUPABASE_KEY }}
      GOALMAKER_UPDATE_URL: ${{ github.server_url }}/${{ github.repository }}
      GOALMAKER_KEYSTORE_PASSWORD: ${{ secrets.GOALMAKER_KEYSTORE_PASSWORD }}
      GOALMAKER_KEY_ALIAS: ${{ secrets.GOALMAKER_KEY_ALIAS }}
      GOALMAKER_KEY_PASSWORD: ${{ secrets.GOALMAKER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Restore the release key
        env:
          GOALMAKER_KEYSTORE_BASE64: ${{ secrets.GOALMAKER_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$GOALMAKER_KEYSTORE_BASE64" | base64 -d > release.jks
          echo "GOALMAKER_KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"

      - name: Test and build the release APK
        run: |
          chmod +x gradlew
          # The unit tests are the same code either way, and this Android plugin only makes the
          # task for the test build type, which is debug.
          ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Verify the signature and name the file
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools_dir/apksigner" verify --print-certs "$apk"
          cp "$apk" "GoalMaker-${{ needs.check.outputs.version }}.apk"

      - name: Remove the release key
        if: always()
        run: rm -f release.jks

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: android/GoalMaker-${{ needs.check.outputs.version }}.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GOALMAKER_SUPABASE_URL: ${{ secrets.GOALMAKER_SUPABASE_URL }}
      GOALMAKER_SUPABASE_KEY: ${{ secrets.GOALMAKER_SUPABASE_KEY }}
      GOALMAKER_UPDATE_URL: ${{ github.server_url }}/${{ github.repository }}
      # DotNetLib.Tray comes from dotnetlib's private GitHub Packages feed (see ci.yml).
      NuGetPackageSourceCredentials_dotnetlib: Username=lukr-99;Password=${{ secrets.DOTNETLIB_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json
          # The same NuGet cache as CI. A tag run can read main's caches, never a pull request's.
          cache: true
          cache-dependency-path: windows/**/*.csproj

      - name: Make sure Inno Setup 6 is available
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Test, publish and compile the installer
        shell: pwsh
        run: |
          dotnet test --solution windows/GoalMaker.slnx -c Release
          ./windows/installer/build-installer.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: windows/installer/dist/GoalMaker-${{ needs.check.outputs.version }}-setup.exe
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release, which is the update channel
    needs: [check, android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Write and sign the manifest
        env:
          GOALMAKER_MANIFEST_SIGNING_KEY: ${{ secrets.GOALMAKER_MANIFEST_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$GOALMAKER_MANIFEST_SIGNING_KEY" > "$RUNNER_TEMP/manifest-key.pem"
          python tools/publish_release.py \
            --version "$VERSION" \
            --android-version-code "${{ needs.check.outputs.version-code }}" \
            --apk "artifacts/GoalMaker-$VERSION.apk" \
            --windows-installer "artifacts/GoalMaker-$VERSION-setup.exe" \
            --notes "GoalMaker $VERSION" \
            --signing-key "$RUNNER_TEMP/manifest-key.pem" \
            --output release-out
          rm -f "$RUNNER_TEMP/manifest-key.pem"

      # Published, not drafted: the apps read the latest release's manifest.json and manifest.sig.
      # On a run by hand the tag does not exist yet, so the release makes it on the built commit.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp release-out/manifest.json release-out/manifest.sig artifacts/
          (cd artifacts && sha256sum GoalMaker-* manifest.json manifest.sig > SHA256SUMS)
          gh release create "$TAG" --target "$GITHUB_SHA" --latest --title "GoalMaker $VERSION" --generate-notes \
            artifacts/GoalMaker-* artifacts/manifest.json artifacts/manifest.sig artifacts/SHA256SUMS
