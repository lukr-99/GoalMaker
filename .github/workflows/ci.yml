name: CI

# Every part of GoalMaker, on every push to main and every pull request. Make the four jobs
# required checks on main (docs/setup/signing-and-releases.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase:
    name: Supabase migrations, row security and the connector
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the pinned Supabase CLI and Deno
        run: npm ci

      - name: Start the local stack
        # The database, auth, storage, the gateway and the Edge Functions runtime are needed for the tests.
        run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor

      - name: Full chain, isolated steps and pgTAP
        run: python tools/supabase_migrations.py test

      - name: The synced-tables contract matches the replica and the server
        run: python tools/check_synced_tables.py --server

      - name: Connector lint, types and unit tests (the shared rules run the contract vectors)
        working-directory: supabase/functions
        run: |
          npx deno task lint
          npx deno task check
          npx deno test --allow-read --allow-env --allow-net _shared connector

      - name: Connector end to end through its MCP endpoint
        working-directory: supabase/functions
        run: |
          npx supabase functions serve > "$RUNNER_TEMP/functions.log" 2>&1 &
          # The function answers 404 to an unknown link once it is up.
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://127.0.0.1:55321/functions/v1/connector/$(printf 'x%.0s' $(seq 1 43))") || true
            if [ "$code" = "404" ]; then break; fi
            sleep 2
          done
          GOALMAKER_CONNECTOR_TEST=1 npx deno test --allow-read --allow-env --allow-net connector/endpoint_test.ts

      - name: Functions log
        if: failure()
        run: cat "$RUNNER_TEMP/functions.log" || true

      - name: Stop the local stack
        if: always()
        run: npx supabase stop --no-backup

  android:
    name: Android build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        with:
          # The action's default also asks for the retired "tools" package (Tarot2Go, 2026-09-14).
          packages: platform-tools

      - name: Build, unit test and lint
        # AGP downloads the compile SDK and build tools it needs; setup-android accepted the licenses.
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: warn

  windows:
    name: Windows format, build and tests
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json
          cache: true
          cache-dependency-path: windows/**/*.csproj

      - name: Restore
        run: dotnet restore GoalMaker.slnx

      - name: Check formatting
        run: dotnet format GoalMaker.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build GoalMaker.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution GoalMaker.slnx -c Release --no-build
