name: Repository baseline

# Runs on pull requests (where "validate" is a required check) and on main. It used to run on every
# push to any branch too, which ran it twice for each pull request push (docs/setup/ci.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate repository
        run: python tools/validate_repository.py --root .

      - name: Test the device replica's migration chain
        run: python tools/migrations.py test replica/migrations

      - name: The synced-tables contract matches the replica
        run: python tools/check_synced_tables.py

      - name: Every theme is complete and readable (WCAG AA)
        run: python tools/check_design_tokens.py

      - name: The review prompt library is sound
        run: python tools/check_prompts.py

      - name: The Tally defaults are sound
        run: python tools/check_tally_rules.py

      - name: Every control has something a screen reader can read
        run: python tools/check_accessibility.py

      - name: A fork runs its own project and signing key
        run: python tools/check_own_copy.py

      - name: Check PowerShell syntax
        shell: pwsh
        run: ./tools/test-powershell-syntax.ps1

      # The self-test builds a throwaway git repository; the PowerShell image has no git.
      - name: Install git
        shell: bash
        run: |
          # The GitHub runner has git and a non-root user; Kiln's container runs as root and may lack git.
          if ! command -v git > /dev/null; then
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; fi
            $SUDO apt-get update -qq && $SUDO apt-get install -y -qq git
          fi

      - name: The release backend script's checks pass
        shell: pwsh
        run: ./tools/test-release-backend.ps1
