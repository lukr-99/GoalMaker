# A dev build starts on Today with no sign-in: it keeps its rows on the device (docs/sign-in.md).
appId: com.goalmaker.app.debug
name: Launch smoke
tags:
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Add a task…"
    timeout: 60000
- assertVisible: "Nothing planned for today. Add a task below or pick one from the Inbox."
- assertVisible: "Tomorrow"
- assertVisible: "Inbox"
- assertVisible: "Places"
